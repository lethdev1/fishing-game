<!DOCTYPE html>
<html lang="en"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LethalOrca 3D - Babylon.js Engine</title>
    
    <!-- Solana Web3 SDK & Babylon.js Engine CDNs -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #020910; height: 100vh; overflow: hidden; color: white; }
        
        .container { width: 100%; height: 100vh; position: relative; }
        
        /* Top Navigation Bar */
        .top-bar { position: absolute; top: 0; left: 0; right: 0; padding: 20px; background: rgba(0,0,0,0.6); display: flex; justify-content: space-between; align-items: center; z-index: 100; backdrop-filter: blur(8px); }
        .top-bar-left { display: flex; gap: 20px; align-items: center; font-size: 18px; font-weight: 700; }
        .logo-box { width: 40px; height: 40px; border: 2px solid cyan; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(0,212,255,0.1); font-size: 20px; }
        
        .timer { font-size: 22px; font-weight: 700; color: #ffd700; }
        
        .wallet-btn { background: linear-gradient(135deg, cyan, #00a8cc); color: black; border: none; padding: 12px 24px; border-radius: 20px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 0 10px rgba(0,212,255,0.4); }
        .wallet-btn:hover { transform: scale(1.05); }
        .wallet-btn.connected { background: #00ff88; color: black; }
        
        /* Start & End Screens */
        #startScreen, #endScreen { position: absolute; inset: 0; background: rgba(2,9,16,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; text-align: center; backdrop-filter: blur(10px); }
        #startScreen h1 { font-size: 48px; margin-bottom: 15px; color: cyan; text-shadow: 0 0 20px rgba(0,255,255,0.5); }
        #startScreen p { font-size: 18px; margin-bottom: 30px; color: #a5d8ff; max-width: 420px; }
        
        .btn-action { background: cyan; color: black; border: none; padding: 15px 40px; font-size: 18px; font-weight: 700; cursor: pointer; border-radius: 12px; box-shadow: 0 0 20px rgba(0,255,255,0.4); transition: 0.3s; }
        .btn-action:hover { transform: scale(1.05); background: #5eead4; }

        #endScreen { display: none; }
        #endScreen.show { display: flex; }
        #endScreen h2 { font-size: 38px; color: #00ff88; margin-bottom: 15px; }

        /* Babylon.js 3D Canvas */
        #renderCanvas { width: 100%; height: 100%; touch-action: none; position: absolute; inset: 0; z-index: 1; outline: none; }
        
        .catch-text { position: absolute; font-size: 28px; font-weight: 800; color: gold; pointer-events: none; transform: translate(-50%, -50%); text-shadow: 0 0 8px black; animation: floatUp 0.8s ease-out forwards; z-index: 10; }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); } 100% { opacity: 0; transform: translate(-50%, -100px) scale(1.3); } }

        /* Wallet Panel */
        #walletPanel { position: fixed; right: -360px; top: 0; width: 360px; height: 100vh; background: rgba(0,20,40,0.95); border-left: 2px solid cyan; z-index: 150; padding: 25px; transition: right 0.3s; backdrop-filter: blur(10px); }
        #walletPanel.open { right: 0; }
        .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; color: cyan; font-size: 24px; cursor: pointer; }
        .panel-title { font-size: 22px; color: cyan; margin-bottom: 15px; font-weight: 700; }
        .panel-btn { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 14px; }
        .connect-btn { background: cyan; color: black; }
        .reward-btn { background: linear-gradient(135deg, #ffd700, #ffed4e); color: black; }
        .reward-btn:disabled { opacity: 0.5; cursor: not-allowed; background: #555; color: #aaa; }
        .withdraw-btn { background: #00ff88; color: black; font-size: 15px; margin-top: 10px; }
        .wallet-info { background: rgba(0,212,255,0.1); padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
        .info-value { color: cyan; font-family: monospace; word-break: break-all; margin-top: 4px; }
        #walletConnected { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Start Screen -->
        <div id="startScreen">
            <h1>🐋 LethalOrca 3D</h1>
            <p>Powered by Babylon.js Engine! Click 3D targets to catch fish & earn $LORCA tokens.</p>
            <button class="btn-action" onclick="startGame()">Start 3D Game</button>
        </div>

        <!-- End Screen -->
        <div id="endScreen">
            <h2>Time's Up!</h2>
            <p id="finalScore" style="font-size: 22px; margin-bottom: 20px; color: #e0e0e0;"></p>
            <button class="btn-action" onclick="startGame()">Play Again</button>
        </div>

        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="logo-box">🐋</div>
                <span><span id="tokenCount">0</span> LORCA</span>
            </div>
            <div class="timer" id="timer">20</div>
            <button class="wallet-btn" id="walletBtn" onclick="togglePanel()">Connect Wallet</button>
        </div>

        <!-- Babylon.js Canvas -->
        <canvas id="renderCanvas"></canvas>

        <!-- Wallet Panel -->
        <div id="walletPanel">
            <button class="close-btn" onclick="togglePanel()">✕</button>
            <div class="panel-title">Wallet & Rewards</div>

            <div id="walletDisconnected">
                <p style="font-size: 13px; margin-bottom: 15px; color: #aaa;">Connect Phantom Wallet to claim rewards & withdraw.</p>
                <button class="panel-btn connect-btn" onclick="connectPhantom()">Connect Phantom</button>
            </div>

            <div id="walletConnected">
                <div class="wallet-info">
                    <div>WALLET ADDRESS</div>
                    <div class="info-value" id="walletAddr">—</div>
                </div>
                <div class="wallet-info">
                    <div>BALANCE</div>
                    <div class="info-value" style="font-size: 18px; color: #00ff88;"><span id="walletBal">0</span> LORCA</div>
                </div>
                
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; border: 1px solid rgba(0,255,255,0.2);">
                    <p style="font-size: 12px; color: cyan; margin-bottom: 8px; font-weight: 700;">🎁 CLAIM REWARDS:</p>
                    <button class="panel-btn reward-btn" id="claimBtn" onclick="claimReward()">Claim 500 LORCA Bonus</button>
                </div>
                
                <button class="panel-btn withdraw-btn" id="withdrawBtn" onclick="withdraw()">💰 Withdraw LORCA</button>
            </div>
        </div>
    </div>

    <script>
        // Game State Variables
        let walletBalance = 0;
        let roundScore = 0;
        let timeLeft = 20;
        let gameOn = false;
        let walletOk = false;
        let userAddr = null;
        let gameTimer = null;

        // Babylon.js Variables
        let canvas, engine, scene, camera;
        let activeFishes = [];

        function initBabylonEngine() {
            canvas = document.getElementById("renderCanvas");
            engine = new BABYLON.Engine(canvas, true);

            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.07, 0.16, 1);

            // Underwater Fog
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogColor = new BABYLON.Color3(0.01, 0.07, 0.16);
            scene.fogDensity = 0.02;

            // Camera & Lighting
            camera = new BABYLON.FreeCamera("camera1", new BABYLON.Vector3(0, 0, -25), scene);
            camera.setTarget(BABYLON.Vector3.Zero());

            const light = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.9;
            light.diffuse = new BABYLON.Color3(0, 0.8, 1);

            // Pointer Event for Catching 3D Objects
            scene.onPointerDown = function (evt, pickResult) {
                if (!gameOn) return;
                if (pickResult.hit && pickResult.pickedMesh && pickResult.pickedMesh.userData) {
                    const mesh = pickResult.pickedMesh;
                    catch3DFish(mesh, evt.clientX, evt.clientY);
                }
            };

            engine.runRenderLoop(function () {
                if (gameOn) {
                    if (activeFishes.length < 8) spawnBabylonFish(Math.random() < 0.2);

                    for (let i = activeFishes.length - 1; i >= 0; i--) {
                        let f = activeFishes[i];
                        f.position.x += f.userData.speed;
                        f.position.y += Math.sin(Date.now() * 0.003 + f.userData.sway) * 0.03;

                        if (Math.abs(f.position.x) > 30) {
                            f.dispose();
                            activeFishes.splice(i, 1);
                        }
                    }
                }
                scene.render();
            });

            window.addEventListener("resize", function () {
                engine.resize();
            });
        }

        function spawnBabylonFish(isOrca = false) {
            const meshName = isOrca ? "orca" : "fish";
            let mesh;

            if (isOrca) {
                mesh = BABYLON.MeshBuilder.CreateCone(meshName, { diameter: 3, height: 7, tessellation: 16 }, scene);
            } else {
                mesh = BABYLON.MeshBuilder.CreateCone(meshName, { diameter: 1.5, height: 4, tessellation: 12 }, scene);
            }

            mesh.rotation.z = Math.PI / 2;

            const mat = new BABYLON.StandardMaterial("fishMat", scene);
            mat.diffuseColor = isOrca ? new BABYLON.Color3(0.03, 0.1, 0.2) : (Math.random() > 0.5 ? new BABYLON.Color3(1, 0.6, 0) : new BABYLON.Color3(0, 0.9, 1));
            mat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
            mesh.material = mat;

            const speed = (Math.random() * 0.15 + 0.1) * (Math.random() < 0.5 ? 1 : -1);
            mesh.userData = {
                val: isOrca ? 50 : 20,
                speed: speed,
                sway: Math.random() * 100
            };

            const startX = speed > 0 ? -25 : 25;
            const startY = (Math.random() - 0.5) * 18;
            const startZ = (Math.random() - 0.5) * 10;
            mesh.position = new BABYLON.Vector3(startX, startY, startZ);

            if (speed < 0) mesh.rotation.y = Math.PI;

            activeFishes.push(mesh);
        }

        function catch3DFish(mesh, x, y) {
            const val = mesh.userData.val;
            roundScore += val;
            walletBalance += val;
            updateBalanceDisplay();

            // Catch UI Effect
            const txt = document.createElement('div');
            txt.className = 'catch-text';
            txt.textContent = '+' + val;
            txt.style.left = x + 'px';
            txt.style.top = y + 'px';
            document.body.appendChild(txt);
            setTimeout(() => txt.remove(), 800);

            // Remove mesh from scene
            const idx = activeFishes.indexOf(mesh);
            if (idx > -1) activeFishes.splice(idx, 1);
            mesh.dispose();
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('endScreen').classList.remove('show');
            
            activeFishes.forEach(f => f.dispose());
            activeFishes = [];

            roundScore = 0;
            timeLeft = 20;
            updateBalanceDisplay();
            document.getElementById('timer').textContent = '20';
            gameOn = true;

            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function endGame() {
            gameOn = false;
            clearInterval(gameTimer);
            document.getElementById('finalScore').textContent = 'You earned ' + roundScore + ' LORCA in this Babylon.js round!';
            document.getElementById('endScreen').classList.add('show');
        }

        function updateBalanceDisplay() {
            document.getElementById('tokenCount').textContent = walletBalance.toLocaleString();
            document.getElementById('walletBal').textContent = walletBalance.toLocaleString();
        }

        function togglePanel() {
            document.getElementById('walletPanel').classList.toggle('open');
        }

        async function connectPhantom() {
            try {
                const provider = window.phantom?.solana || window.solana;
                if (!provider || !provider.isPhantom) { alert('Please install Phantom Wallet'); return; }
                const res = await provider.connect();
                userAddr = res.publicKey.toString();
                document.getElementById('walletDisconnected').style.display = 'none';
                document.getElementById('walletConnected').style.display = 'block';
                document.getElementById('walletAddr').textContent = userAddr.slice(0, 8) + '...' + userAddr.slice(-8);
                document.getElementById('walletBtn').classList.add('connected');
                document.getElementById('walletBtn').textContent = '✓ Connected';
                walletOk = true;
            } catch (e) { alert('Error: ' + e.message); }
        }

        function claimReward() {
            if (!walletOk) return alert('Connect Phantom Wallet first');
            walletBalance += 500;
            updateBalanceDisplay();
            alert('🎉 Claimed 500 LORCA Bonus!');
            document.getElementById('claimBtn').disabled = true;
        }

        function withdraw() {
            if (!walletOk) return alert('Connect Phantom Wallet first');
            if (walletBalance === 0) return alert('No tokens available to withdraw');
            alert(`Withdrawal request submitted for ${walletBalance} LORCA to ${userAddr.slice(0,8)}...`);
            walletBalance = 0;
            updateBalanceDisplay();
        }

        window.onload = initBabylonEngine;
    </script>
</body>
</html>
